# ConfigMaps con los scripts init.sql de cada base de datos.
# Se montan en /docker-entrypoint-initdb.d de cada PostgreSQL (ver bases-datos.yaml).
# Si cambias un init.sql, actualiza también este archivo.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: usuarios-init
  namespace: microservicios
data:
  init.sql: |
    CREATE TABLE usuarios (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        email VARCHAR(150) UNIQUE NOT NULL
    );

    INSERT INTO usuarios (nombre, email) VALUES
    ('Ana Torres', 'ana@correo.com'),
    ('Luis Pérez', 'luis@correo.com'),
    ('Carlos Mendoza', 'carlos@correo.com');
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: productos-init
  namespace: microservicios
data:
  init.sql: |
    CREATE TABLE productos (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        precio DECIMAL(10,2) NOT NULL
    );

    INSERT INTO productos (nombre, precio) VALUES
    ('Laptop', 2500.00),
    ('Teclado', 120.00),
    ('Mouse', 80.00);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pedidos-init
  namespace: microservicios
data:
  init.sql: |
    -- Cada microservicio tiene su propia base de datos, por eso no hay claves
    -- foráneas hacia usuarios ni productos: la validación la hace la API de pedidos.
    CREATE TABLE pedidos (
        id SERIAL PRIMARY KEY,
        usuario_id INTEGER NOT NULL,
        producto_id INTEGER NOT NULL,
        cantidad INTEGER NOT NULL CHECK (cantidad > 0)
    );

    INSERT INTO pedidos (usuario_id, producto_id, cantidad) VALUES
    (1, 1, 1),
    (2, 2, 2),
    (3, 3, 1);
